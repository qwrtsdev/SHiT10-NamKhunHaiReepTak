<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <title>น้ำขึ้นให้รีบตัก</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font: 13px/1.4 system-ui, sans-serif;
      color: #0d2a52;
      background: #f3f8ff;
    }

    h1 {
      font-size: 15px;
      margin: 0 0 10px;
    }

    .bar {
      height: 14px;
      border-radius: 7px;
      background: #dbe7f6;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #4aa3ff, #1565c0);
      transition: width .3s;
    }

    .pct {
      margin: 4px 0 12px;
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 9px;
      border: 0;
      border-radius: 8px;
      background: #1565c0;
      color: #fff;
      font: 600 13px system-ui;
      cursor: pointer;
    }

    button:hover {
      background: #0d4fa0;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    button.on {
      background: #148c5a;
    }

    button.ghost {
      background: transparent;
      color: inherit;
      border: 1px solid currentColor;
    }

    .modes {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .modes button {
      background: transparent;
      color: inherit;
      border: 1px solid #1565c0;
    }

    .modes button.on {
      background: #1565c0;
      color: #fff;
    }

    .cam {
      display: grid;
      gap: 6px;
      margin-bottom: 10px;
    }

    .cam img {
      width: 100%;
      border-radius: 8px;
      transform: scaleX(-1);
      background: #000;
    }

    .jc {
      display: grid;
      gap: 6px;
    }

    .pad {
      padding: 8px;
      border-radius: 8px;
      background: rgba(21, 101, 192, .08);
      display: grid;
      gap: 3px;
    }

    .pad .state {
      font-weight: 600;
    }

    label {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    label input[type=range] {
      flex: 1;
    }

    .muted {
      color: #6a7d99;
      font-size: 12px;
    }

    .cheat {
      all: unset;
      display: block;
      margin-top: 12px;
      color: #7a8aa3;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }

    [hidden] {
      display: none !important;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0f1b2d;
        color: #dce9ff;
      }

      .bar {
        background: #213551;
      }
    }
  </style>
</head>

<body>
  <h1>💧 ระดับน้ำท่วมตอนนี้</h1>
  <div class="bar">
    <div class="fill"></div>
  </div>
  <div class="pct">0%</div>

  <div class="modes">
    <button id="modeCam" data-mode="cam">เทน้ำออก</button>
    <button id="modeJoycon" data-mode="joycon">ตักน้ำออก</button>
  </div>
  <div id="noMode" class="muted">เลือกวิธีเอาน้ำออก (กดซ้ำเพื่อปิด)</div>

  <div class="cam" id="camPanel" hidden>
    <div class="muted">เอียงโน้ตบุ๊ก แล้วน้ำจะไหลออกทางขอบจอ</div>
    <button id="camStart" hidden>📷 เริ่มที่แท็บนี้</button>
    <img id="camFrame" alt="" hidden>
    <div id="camStatus" class="muted"></div>
    <button id="calibrate" class="ghost" hidden>ตั้งระดับใหม่</button>
  </div>
  <div class="jc" id="joyconPanel" hidden>
    <div class="muted">ชี้จอยคอนลงเพื่อตักน้ำ แล้วสะบัดขึ้นเพื่อเทออก</div>
    <button id="pair">🎮 เชื่อมต่อจอยคอน</button>
    <div id="pads"></div>
    <div id="jcStatus" class="muted"></div>
    <div id="jcControls" class="jc" hidden>
      <label>ความแรงการสั่น <input type="range" id="gain" min="0" max="1" step="0.05"></label>
      <label><input type="checkbox" id="invert"> สลับทิศการตัก</label>
    </div>
  </div>

  <button id="cheat" class="cheat">เอาน้ำออกทั้งหมด</button>
  <script src="popup.js"></script>
</body>

</html>
